services:
  api:
    container_name: maliste-api
    image: ghcr.io/jonabricot/maliste/api:latest
    ports: 
      - 3002:3000
    env_file: .env.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.maliste.les-bouzous.fr`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=mytlschallenge"
    depends_on: 
      - db
  
  web: 
    container_name: maliste-web
    image: ghcr.io/jonabricot/maliste/web:latest
    ports: 
      - 3003:3001
    env_file: .env.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`maliste.les-bouzous.fr`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=mytlschallenge"

  db:
    container_name: maliste-db
    image: postgres
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5433:5432
    env_file: .env.local
  
  proxy:
    image: "traefik"
    container_name: maliste-proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=contact@maliste.les-bouzous.fr"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  pgdata: